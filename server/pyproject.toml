[project]
name = "real-estate-voice-agent"
version = "0.1.0"
description = "Voice AI bot built with Pipecat"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai-small-webrtc-prebuilt>=2.5.0",
    "pipecat-ai[deepgram,elevenlabs,evals,google,runner,silero,webrtc,websocket]>=1.4.0",
    "twilio>=9.10.9",
    "aiosqlite>=0.20.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I", "UP"]
